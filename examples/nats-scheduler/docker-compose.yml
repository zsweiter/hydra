# docker compose -f examples/nats-scheduler/docker-compose.yml up --build
services:
  nats:
    image: nats:2.15.1-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      retries: 15

  scheduler:
    build:
      context: ../..
      dockerfile: cmd/hydra-scheduler/Dockerfile
      args:
        STORE: sqlite
    environment:
      NATS_URL: nats://nats:4222
      # Definitions are published on schedule.notification.>, in
      # their own stream; occurrences go to NOTIFICATIONS.
      HYDRA_STREAMS: SCHEDULES
    volumes:
      - scheduler-data:/data
    depends_on:
      nats:
        condition: service_healthy

  consumer:
    build:
      context: ../..
      dockerfile: examples/nats-scheduler/Dockerfile
      args:
        APP: consumer
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

  producer:
    build:
      context: ../..
      dockerfile: examples/nats-scheduler/Dockerfile
      args:
        APP: producer
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - scheduler
      - consumer
    restart: "no"

volumes:
  nats-data:
  scheduler-data:
