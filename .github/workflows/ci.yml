# Checks every pull request and every push to main. The release
# workflow runs it too (workflow_call) before publishing a tag.
#
# - go:          gofmt, go vet and unit tests of every module
# - integration: the Valkey, Dragonfly, PostgreSQL and NATS tests
#                against throwaway containers
# - image:       the hydra-scheduler image builds for every store
#                (linux/amd64 only, nothing is pushed)
name: ci

on:
    pull_request:
    push:
        branches: [main]
    workflow_call:

# A literal group name: under workflow_call github.workflow is the
# caller's name, which would collide with the release group.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    go:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: "**/go.sum"

            - name: Formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                    echo "gofmt needed on:"; echo "$unformatted"; exit 1
                  fi

            - name: Unit tests
              run: make test-all

    integration:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: "**/go.sum"

            - name: Integration tests (Valkey, Dragonfly, PostgreSQL, NATS)
              run: make test-integration

    image:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                store: [sqlite, redis, postgres]
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - name: Build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: cmd/hydra-scheduler/Dockerfile
                  platforms: linux/amd64
                  build-args: STORE=${{ matrix.store }}
                  push: false
                  cache-from: type=gha,scope=${{ matrix.store }}
